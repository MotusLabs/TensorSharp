name: Release Binaries

# New forks must enable Actions before dispatching a branch-based validation run.
# Builds self-contained, ready-to-run release archives of the TensorSharp apps
# (TensorSharp.Server.Host and TensorSharp.Cli) for each supported platform and
# attaches them to a GitHub Release.
#
# Unlike the managed-only NuGet packages (which are packed without any native
# build), this workflow builds the native libraries on each OS and bundles them
# into the published apps, so each archive is runnable without a .NET install
# or a separate native build:
#
#   - win-x64-cpu      GgmlOps.dll (CPU)                       -> .zip
#   - win-x64-cuda     GgmlOps.dll (+CUDA) + PTX + CUDA redist -> .zip
#   - linux-x64-cpu    libGgmlOps.so (CPU)                     -> .tar.gz
#   - linux-x64-cuda   libGgmlOps.so (+CUDA) + PTX + CUDA redist -> .tar.gz
#   - osx-arm64        libGgmlOps.dylib (Metal) + MLX dylibs   -> .tar.gz
#   - linux-arm64-cuda13-GB10  SM121a GGML + PTX + CUDA 13 redist -> .tar.gz
#
# The x64 CUDA archives bundle the CUDA 12.x runtime libraries (cudart / cublas /
# cublasLt) so they run against any NVIDIA driver new enough for the toolkit;
# they still require an NVIDIA GPU + driver at run time. The CPU archives run
# anywhere (the GGML CPU backend); their pure-C# `--backend cuda` has no PTX and
# falls back to CPU — use a `-cuda` archive (or build from source) for GPU.
# GB10 uses the pinned CUDA 13 Docker builder on native hosted ARM64, without
# a GPU. The artifacts target checks clean-runtime dependencies and startup,
# not model inference. No self-hosted Spark runner is scheduled here.
#
# Trigger: push a version tag like `v2.8.6` (the tag, with the leading `v`
# stripped, becomes the version and a published Release is created). Or run
# `workflow_dispatch` with a `version` input to produce a draft Release.
# Set `gb10_only` on a manual run to test GB10 artifacts without creating a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 2.8.6). Required when not run from a tag."
        required: false
        default: ""
      gb10_only:
        description: "Build and validate only GB10 artifacts; do not create a GitHub Release."
        required: false
        type: boolean
        default: false
      cuda_arch:
        description: "CMake CUDA architectures for ggml CUDA 12 builds (semicolon-separated; GB10 is pinned at SM121a)."
        required: false
        default: "75-real;86-real;89-real;90-real;90-virtual"
      draft:
        description: "Create the GitHub Release as a draft (manual runs only)."
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release build — a half-uploaded release is worse
  # than a queue.
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gb10_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64-cpu
            os: windows-latest
            rid: win-x64
            cuda: false
          - name: win-x64-cuda
            os: windows-latest
            rid: win-x64
            cuda: true
          - name: linux-x64-cpu
            os: ubuntu-latest
            rid: linux-x64
            cuda: false
          - name: linux-x64-cuda
            os: ubuntu-latest
            rid: linux-x64
            cuda: true
          - name: osx-arm64
            os: macos-latest
            rid: osx-arm64
            cuda: false
    runs-on: ${{ matrix.os }}
    # The CUDA ggml build (multiple SASS targets + PTX) and the macOS MLX build
    # (builds mlx-c from source) are minutes-long; give them headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # ggml is not a submodule; the native build scripts fetch it.
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install CUDA toolkit
        if: ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.6.3"
          # network installer; full toolkit so the ggml CUDA backend links
          # cuBLAS and the runtime libs are present to bundle.
          method: "network"
          # On Linux, install only cuda-toolkit-12-6: the default `cuda`
          # metapackage also pulls in the NVIDIA driver + DKMS packages, whose
          # kernel-module build fails on GitHub runners — and a build machine
          # doesn't need the driver. On Windows keep the full default install.
          sub-packages: ${{ runner.os == 'Linux' && '["toolkit"]' || '[]' }}

      - name: Set up MSVC environment (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # Pin the v143 (VS2022) toolset. windows-latest now ships Visual
          # Studio 2026, whose default v145 (MSVC 14.5x) toolset is rejected by
          # CUDA 12.6 nvcc as a host compiler; 14.44 is the newest toolset CUDA
          # 12.6 accepts and is installed on the image alongside VS2026. This
          # also sets VCToolsInstallDir, which the TensorSharp.Backends.Cuda
          # PTX compile uses to point nvcc at the right cl.exe.
          toolset: "14.44"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            echo "::error::No version resolved. Push a tag like v2.8.6 or supply the 'version' input." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Publish apps
        shell: bash
        env:
          # Read by both MSBuild (TensorSharp.Backends.GGML.csproj) and the
          # native build scripts. The first `dotnet publish` triggers the native
          # GGML build (and, when nvcc is present, the CUDA PTX compile); the
          # second is incremental.
          TENSORSHARP_GGML_NATIVE_ENABLE_CUDA: ${{ matrix.cuda && 'ON' || 'OFF' }}
          TENSORSHARP_GGML_NATIVE_CUDA_ARCHITECTURES: ${{ matrix.cuda && (github.event.inputs.cuda_arch || '75-real;86-real;89-real;90-real;90-virtual') || '' }}
          # Keep the ggml-vulkan backend out of the release archives (the
          # Windows runners have vulkan-1.dll, so the build script would
          # otherwise auto-enable it): a Vulkan-linked GgmlOps.dll hard-imports
          # vulkan-1.dll, which machines without GPU drivers (bare servers/VMs)
          # don't have — the whole native library would then fail to load. The
          # archives are documented as CPU / CPU+CUDA builds.
          TENSORSHARP_GGML_NATIVE_ENABLE_VULKAN: "OFF"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Build the GGML native library with Ninja + the vcvars environment
            # from the MSVC setup step. The VS2026-only image has no VS2022
            # instance for CMake's "Visual Studio 17 2022" generator, and a VS
            # generator CUDA build would additionally need CUDA's MSBuild
            # integration for VS2026, which CUDA 12.6 predates. Ninja drives
            # cl.exe/nvcc directly and needs neither.
            export CMAKE_GENERATOR=Ninja
          fi
          V="${{ steps.ver.outputs.version }}"
          # "<archive dir>:<project>". The server's entry point lives in
          # TensorSharp.Server.Host (TensorSharp.Server itself is the library it
          # builds on and has no Main), but the archive keeps the `server` name
          # the download links and the docs already use.
          for entry in "server:TensorSharp.Server.Host" "cli:TensorSharp.Cli"; do
            lc="${entry%%:*}"
            proj="${entry#*:}"
            dotnet publish "$proj/$proj.csproj" \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -p:Version="$V" \
              -o "publish/$lc"
          done

      - name: Stage GGML native library
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows)
              lib=""
              for c in TensorSharp.GGML.Native/build-windows/Release/GgmlOps.dll \
                       TensorSharp.GGML.Native/build-windows/GgmlOps.dll; do
                [ -f "$c" ] && lib="$c" && break
              done
              ;;
            Linux) lib="TensorSharp.GGML.Native/build/libGgmlOps.so" ;;
            macOS) lib="TensorSharp.GGML.Native/build/libGgmlOps.dylib" ;;
          esac
          if [ -z "${lib:-}" ] || [ ! -f "$lib" ]; then
            echo "::error::GGML native library not found (looked for the ${{ runner.os }} build output)." >&2
            exit 1
          fi
          echo "Bundling GGML native library: $lib"
          cp "$lib" publish/server/
          cp "$lib" publish/cli/

      - name: Stage MLX native libraries
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          # mlx.metallib holds MLX's precompiled Metal kernels. It is large
          # (~150 MB) but not optional: mlx locates it via dladdr on its own
          # code, so it has to ship next to libmlx.dylib. Its only fallback is a
          # METAL_PATH baked in at compile time pointing into the CI build tree,
          # which does not exist on an end user's machine -- without it the MLX
          # backend loads and then throws "Failed to load the default metallib"
          # on first use.
          for f in libmlxc.dylib libmlx.dylib libjaccl.dylib mlx.metallib; do
            src="TensorSharp.Backends.MLX/Native/dist/$f"
            [ -f "$src" ] || src="TensorSharp.Backends.MLX/Native/dist/lib/$f"
            if [ -f "$src" ]; then
              cp "$src" publish/server/
              cp "$src" publish/cli/
            else
              echo "::warning::MLX library $f not found; skipping."
            fi
          done

      - name: Stage CUDA PTX kernels
        # The pure-C# `--backend cuda` loads PTX from a cuda_kernels/ subfolder
        # next to the app. nvcc (present only for CUDA builds) compiles it during
        # publish; copy it in explicitly so a propagation miss can't silently
        # downgrade the backend to its CPU fallback.
        if: ${{ matrix.cuda }}
        shell: bash
        run: |
          set -euo pipefail
          # nvcc writes the PTX to the intermediate directory (never into the
          # committed native/ptx baseline, which is the no-nvcc fallback and
          # targets one specific GPU arch; this build's PTX targets the portable
          # fallback arch so it JIT-compiles on any release GPU).
          ptxdir="TensorSharp.Backends.Cuda/obj/cuda_ptx/ptx"
          if [ ! -f "$ptxdir/tensorsharp_kernels.ptx" ]; then
            echo "::error::CUDA PTX kernel not found at $ptxdir/tensorsharp_kernels.ptx (was nvcc available during publish?)." >&2
            exit 1
          fi
          for app in server cli; do
            mkdir -p "publish/$app/cuda_kernels"
            cp "$ptxdir"/*.ptx "publish/$app/cuda_kernels/"
          done

      - name: Stage CUDA runtime (Linux)
        if: ${{ matrix.cuda && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          for f in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            src="$CUDA_PATH/lib64/$f"
            if [ -f "$src" ]; then
              cp -L "$src" publish/server/
              cp -L "$src" publish/cli/
            else
              echo "::warning::CUDA runtime library $f not found at $src; archive will require a system CUDA install."
            fi
          done

      - name: Stage CUDA runtime (Windows)
        if: ${{ matrix.cuda && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($dll in @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")) {
            $src = Join-Path $env:CUDA_PATH "bin\$dll"
            if (Test-Path $src) {
              Copy-Item $src publish/server/
              Copy-Item $src publish/cli/
            } else {
              Write-Host "::warning::CUDA runtime library $dll not found at $src; archive will require a system CUDA install."
            }
          }

      - name: Archive (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          tar -C publish/server -czf "artifacts/tensorsharp-server-$V-${{ matrix.name }}.tar.gz" .
          tar -C publish/cli    -czf "artifacts/tensorsharp-cli-$V-${{ matrix.name }}.tar.gz" .

      - name: Archive (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
          SUFFIX: ${{ matrix.name }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/server/* -DestinationPath "artifacts/tensorsharp-server-$env:V-$env:SUFFIX.zip"
          Compress-Archive -Path publish/cli/*    -DestinationPath "artifacts/tensorsharp-cli-$env:V-$env:SUFFIX.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: artifacts/*
          retention-days: 14

  build-gb10:
    name: Build linux-arm64-cuda13-GB10
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    # The native 4-CPU cold release measured ~11.5 minutes. Allow ample margin for
    # hosted variance, archive verification and upload.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve GB10 release version
        id: ver
        shell: bash
        env:
          V: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$V" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Supply a valid release version or push a version tag." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check native ARM64 builder and resource budget
        shell: bash
        run: |
          set -euo pipefail
          uname -sm
          free -h
          docker version
          docker buildx version
          docker_platform="$(docker info --format '{{.OSType}}/{{.Architecture}}')"
          if [[ "$(uname -sm)" != "Linux aarch64" || ! "$docker_platform" =~ ^linux/(aarch64|arm64)$ ]]; then
            echo "::error::GB10 requires a native Linux ARM64 Docker daemon; x64/QEMU is unsupported." >&2
            exit 1
          fi
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          sudo df -h "$docker_root" "$GITHUB_WORKSPACE"
          docker system df
          docker_free="$(sudo df -B1 --output=avail "$docker_root" | tail -n 1)"
          export_free="$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1)"
          # Fresh docker-container release passed a hard 10 GiB build-store cap:
          # peak 8,970,973,184 bytes plus 1,313,840,034 bytes of external exports.
          # The 12 GiB combined budget also leaves room for BuildKit engine overhead.
          docker_required=$((10 * 1024 * 1024 * 1024))
          export_required=$((2 * 1024 * 1024 * 1024))
          if [[ "$(sudo stat -c %d "$docker_root")" == "$(stat -c %d "$GITHUB_WORKSPACE")" ]]; then
            docker_required=$((12 * 1024 * 1024 * 1024))
            export_required="$docker_required"
          fi
          if (( docker_free < docker_required || export_free < export_required )); then
            echo "::error::GB10 requires at least 10 GiB free Docker storage and 2 GiB free export space, or 12 GiB free when they share a filesystem. The measured fresh release passed a hard 10 GiB build-store cap with ~1.3 GB external exports; the combined budget includes BuildKit engine headroom. No host cleanup or runner fallback is performed." >&2
            exit 1
          fi

      - name: Set up isolated GB10 builder
        id: gb10-builder
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: memory=8g

      - name: Build and validate GB10 release archives (no GPU)
        timeout-minutes: 90
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --builder "${{ steps.gb10-builder.outputs.name }}" \
            --progress=plain --platform linux/arm64 \
            -f eng/Dockerfile.gb10 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg RELEASE_VERSION="$V" \
            --build-arg GGML_BUILD_JOBS=2 \
            --target artifacts --output type=local,dest=artifacts/gb10 .

      - name: Verify and name GB10 release assets
        shell: bash
        working-directory: artifacts/gb10
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for app in cli server; do
            test -s "tensorsharp-$app-$V-linux-arm64-cuda13-GB10.tar.gz"
          done
          test -s GB10-VALIDATION.txt
          sha256sum --check --strict SHA256SUMS
          # download-artifact merges all release-* artifacts into one directory.
          mv SHA256SUMS "tensorsharp-$V-linux-arm64-cuda13-GB10-SHA256SUMS"
          mv GB10-VALIDATION.txt "tensorsharp-$V-linux-arm64-cuda13-GB10-VALIDATION.txt"

      - name: Upload GB10 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64-cuda13-GB10
          path: artifacts/gb10/*
          if-no-files-found: error
          # The tarballs are already compressed; avoid a second compression pass
          # and retain this large handoff only long enough to publish the release.
          compression-level: 0
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gb10_only }}
    needs: [build, build-gb10]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            echo "::error::No version resolved." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify downloaded GB10 archives
        shell: bash
        working-directory: dist
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check --strict "tensorsharp-$V-linux-arm64-cuda13-GB10-SHA256SUMS"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TensorSharp ${{ steps.ver.outputs.version }}
          # Tag pushes publish immediately; manual runs default to a draft.
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**/*
