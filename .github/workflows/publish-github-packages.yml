name: Publish GitHub Packages

# Packs the public TensorSharp packages and pushes them to the repository
# owner's GitHub Packages NuGet feed (nuget.pkg.github.com/<owner>).
#
# Trigger: push a version tag like `v2.8.6` — the tag (with the leading `v`
# stripped) becomes the package version, overriding the default in
# Directory.Build.props. `workflow_dispatch` is also available for manual
# publishes; it accepts an explicit `version` and a `dry_run` that packs and
# verifies without pushing.
#
# Packing is managed-only: the native libraries (GGML/CUDA/MLX) are not
# embedded in the .nupkg, so this job skips the native build (-SkipNativeBuild)
# and runs on a stock GitHub-hosted runner with no GPU/CMake toolchain.
#
# Authentication: the workflow's own GITHUB_TOKEN with `packages: write`.
# No external feed, no OIDC, no API keys. GitHub Packages does not accept
# symbol packages, so only *.nupkg is pushed; *.snupkg remain available as
# workflow artifacts.
#
# Packages are pushed one at a time rather than by glob so a rejected package
# is visible in the log instead of hidden behind a later failure.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 2.8.6). Required when not run from a tag."
        required: false
        default: ""
      dry_run:
        description: "Pack and verify only; do not push."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  # Never cancel an in-flight publish — a half-pushed release is worse than a queue.
  group: publish-github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Native libraries are not packed, so the ggml sources are not needed.
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            echo "::error::No version resolved. Push a tag like v2.8.6 or supply the 'version' input." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $V"

      - name: Pack & verify packages
        shell: pwsh
        run: >-
          ./eng/verify-packages.ps1
          -PackageVersion '${{ steps.ver.outputs.version }}'
          -SkipNativeBuild
          -OutputDirectory artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.ver.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          retention-days: 30

      - name: Push to GitHub Packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Packages does not accept symbol packages, so only *.nupkg here.
          for pkg in artifacts/packages/*.nupkg; do
            echo "::group::$(basename "$pkg")"
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
            echo "::endgroup::"
          done
